<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>مجمع جبري | تعديل مستأجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #f7f4ec;
            --card: rgba(255,255,255,0.72);
            --text: #1f2937;
            --muted: #7a7469;
            --gold: #c9a46b;
            --gold-deep: #b78e54;
            --line: rgba(91,73,42,0.10);
            --success: #159a6f;
            --danger: #d14d4d;
            --shadow: 0 18px 45px rgba(87,68,37,0.10);
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at top right, rgba(201,164,107,0.11), transparent 22%),
                linear-gradient(135deg, #f8f4eb 0%, #f2ede3 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .shell {
            max-width: 600px;
            margin: 0 auto;
        }

        .panel {
            background: var(--card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.72);
            box-shadow: var(--shadow);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 18px;
        }

        .chip-header {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 16px;
        }

        .chip-title {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            color: var(--gold-deep);
            background: rgba(201,164,107,0.12);
            border: 1px solid rgba(201,164,107,0.22);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .field label {
            font-size: 12px;
            font-weight: 800;
            color: #8b6a3a;
            padding-right: 4px;
        }

        .field input,
        .field select {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 14px 15px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.84);
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }

        .field select {
            cursor: pointer;
        }

        .field select:disabled {
            cursor: wait;
            opacity: 0.75;
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,164,107,0.15);
        }

        .field input[readonly] {
            background: rgba(201,164,107,0.08);
            color: var(--muted);
            cursor: not-allowed;
        }

        .field small {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
        }

        .btn {
            border: none;
            cursor: pointer;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.25s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #fff;
            box-shadow: 0 12px 24px rgba(201,164,107,0.22);
        }

        .btn-soft {
            background: #fff;
            border: 1px solid var(--line);
            color: var(--text);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-group .btn {
            flex: 1;
        }

        .status-msg {
            display: none;
            margin-top: 14px;
            padding: 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            white-space: pre-line;
        }

        .status-msg.show {
            display: block;
        }

        .status-msg.info {
            background: rgba(201,164,107,0.12);
            color: #6b4f2b;
            border: 1px solid rgba(201,164,107,0.18);
        }

        .status-msg.success {
            background: rgba(21,154,111,0.12);
            color: var(--success);
            border: 1px solid rgba(21,154,111,0.18);
        }

        .status-msg.error {
            background: rgba(209,77,77,0.12);
            color: var(--danger);
            border: 1px solid rgba(209,77,77,0.18);
        }

        .retry-btn {
            display: none;
            margin-top: 10px;
        }

        .retry-btn.show {
            display: inline-flex;
        }

        .back-home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 16px;
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid rgba(201,164,107,0.22);
            background: var(--card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            color: var(--gold-deep);
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            text-decoration: none;
            transition: 0.25s ease;
        }

        .back-home-btn:hover {
            transform: translateY(-1px);
            background: rgba(201,164,107,0.12);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="shell">

        <!-- اختيار المستأجر -->
        <section class="panel">
            <div class="chip-header">
                <div class="chip-title">✏️ تعديل مستأجر</div>
            </div>

            <div class="field">
                <label for="tenant_select">اختر المستأجر</label>
                <select id="tenant_select" disabled>
                    <option value="">⏳ جاري تحميل المستأجرين...</option>
                </select>
            </div>

            <!-- ظاهر دائماً حتى تظهر أخطاء الاتصال -->
            <div id="load_status_msg" class="status-msg info show">جاري الاتصال بقاعدة البيانات...</div>
            <button id="retry_btn" class="btn btn-soft retry-btn" type="button">🔄 إعادة المحاولة</button>
        </section>

        <!-- نموذج التعديل -->
        <section class="panel hidden" id="edit_panel">
            <div class="chip-header">
                <div class="chip-title">📝 بيانات المستأجر</div>
            </div>

            <div id="status_msg" class="status-msg"></div>

            <form id="tenantForm" novalidate>
                <div class="field">
                    <label for="tenant_code">كود المستأجر</label>
                    <input type="text" id="tenant_code" readonly />
                    <small>لا يمكن تعديل الكود</small>
                </div>

                <div class="field">
                    <label for="created_at">تاريخ الإنشاء</label>
                    <input type="text" id="created_at" readonly />
                    <small>لا يمكن تعديل تاريخ الإنشاء</small>
                </div>

                <div class="field">
                    <label for="tenant_name">اسم المستأجر <span style="color:var(--danger);">*</span></label>
                    <input type="text" id="tenant_name" placeholder="مثال: محمد أحمد" required />
                </div>

                <div class="field">
                    <label for="shop_no">رقم المحل</label>
                    <input type="text" id="shop_no" placeholder="مثال: 25" />
                </div>

                <div class="field">
                    <label for="phone">رقم الجوال</label>
                    <input type="tel" id="phone" placeholder="مثال: 0791234567" inputmode="tel" />
                    <small>يُحفظ بصيغة 962...</small>
                </div>

                <div class="field">
                    <label for="annual_rent">قيمة العقد السنوي <span style="color:var(--danger);">*</span></label>
                    <input type="number" id="annual_rent" placeholder="مثال: 1836" min="0.01" step="0.01" required />
                </div>

                <div class="field">
                    <label for="contract_date">تاريخ العقد</label>
                    <input type="date" id="contract_date" />
                    <small>تعديل تاريخ العقد لا يعيد احتساب السنوات السابقة</small>
                </div>

                <div class="field">
                    <label for="password">كلمة المرور (اختياري)</label>
                    <input type="password" id="password" placeholder="اتركها فارغة للإبقاء على الحالية" maxlength="4" inputmode="numeric" autocomplete="new-password" />
                    <small>4 أرقام — اتركها فارغة إذا لم ترغب بتغييرها</small>
                </div>

                <div class="btn-group">
                    <button class="btn btn-gold" id="save_btn" type="submit">💾 حفظ التعديلات</button>
                    <button class="btn btn-soft" id="reset_btn" type="button">🔄 استعادة البيانات</button>
                </div>
            </form>
        </section>

        <a class="back-home-btn" href="admin.html" aria-label="العودة إلى لوحة الإدارة">🏠 العودة إلى لوحة الإدارة</a>
    </div>

    <script>
        'use strict';

        /*
         * ملاحظة مهمة:
         * يتم تعيين المفتاح الصحيح أدناه في متغير مستقل لتجنب أي تعارض
         * مع الكائن العام window.supabase الذي تنشئه مكتبة Supabase.
         */
        const SUPABASE_URL = 'https://gzukfvxcpfblzqyjzkoz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dWtmdnhjcGZibHpxeWp6a296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MjA3NjgsImV4cCI6MjA4OTM5Njc2OH0.7Jm1pg1MZEVj4B4IiGPU0yNmMPEPmClwUUkAv_rvGBU';

        let db = null;
        let allTenants = [];
        let currentTenant = null;
        let isSaving = false;

        const tenantSelect = document.getElementById('tenant_select');
        const editPanel = document.getElementById('edit_panel');
        const tenantForm = document.getElementById('tenantForm');
        const saveButton = document.getElementById('save_btn');
        const resetButton = document.getElementById('reset_btn');
        const retryButton = document.getElementById('retry_btn');

        function setLoadStatus(message, type = 'info') {
            const el = document.getElementById('load_status_msg');
            el.textContent = message;
            el.className = `status-msg ${type} show`;
        }

        function showFormStatus(message, type) {
            const el = document.getElementById('status_msg');
            el.textContent = message;
            el.className = `status-msg ${type} show`;
        }

        function clearFormStatus() {
            const el = document.getElementById('status_msg');
            el.textContent = '';
            el.className = 'status-msg';
        }

        function extractTenantNumber(code) {
            const match = String(code || '').match(/\d+/);
            return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
        }

        function normalizePhoneForDisplay(phone) {
            return String(phone || '').trim();
        }

        function normalizePhoneForDatabase(phone) {
            let value = String(phone || '').replace(/\D/g, '');
            if (!value) return null;

            if (value.startsWith('00962')) {
                value = value.slice(2);
            }

            if (value.startsWith('0')) {
                value = value.slice(1);
            }

            if (!value.startsWith('962')) {
                value = `962${value}`;
            }

            return value;
        }

        function initializeSupabaseClient() {
            if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                throw new Error('تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت ثم أعد المحاولة.');
            }

            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        function renderTenantOptions(tenants) {
            tenantSelect.innerHTML = '<option value="">-- اختر المستأجر --</option>';

            tenants.forEach((tenant) => {
                const option = document.createElement('option');
                option.value = String(tenant.tenant_code || '');
                option.textContent = `${String(tenant.tenant_code || '').toUpperCase()} — ${tenant.tenant_name || 'بدون اسم'}`;
                tenantSelect.appendChild(option);
            });
        }

        async function loadTenantsList() {
            tenantSelect.disabled = true;
            tenantSelect.innerHTML = '<option value="">⏳ جاري تحميل المستأجرين...</option>';
            retryButton.classList.remove('show');
            editPanel.classList.add('hidden');
            currentTenant = null;
            setLoadStatus('جاري الاتصال بقاعدة البيانات...', 'info');

            try {
                if (!db) {
                    initializeSupabaseClient();
                }

                const { data, error } = await db
                    .from('tenants')
                    .select('id, tenant_code, tenant_name, shop_no, phone, created_at, contract_date, annual_rent, password');

                if (error) {
                    throw error;
                }

                allTenants = Array.isArray(data) ? data : [];

                allTenants.sort((a, b) => {
                    const numberDifference = extractTenantNumber(a.tenant_code) - extractTenantNumber(b.tenant_code);
                    if (numberDifference !== 0) return numberDifference;
                    return String(a.tenant_name || '').localeCompare(String(b.tenant_name || ''), 'ar');
                });

                if (allTenants.length === 0) {
                    tenantSelect.innerHTML = '<option value="">لا يوجد مستأجرون مسجلون</option>';
                    tenantSelect.disabled = true;
                    setLoadStatus('تم الاتصال بقاعدة البيانات، لكن جدول tenants لا يحتوي على مستأجرين.', 'info');
                    return;
                }

                renderTenantOptions(allTenants);
                tenantSelect.disabled = false;
                setLoadStatus(`✅ تم تحميل ${allTenants.length} مستأجر بنجاح. اختر مستأجرًا من القائمة.`, 'success');
                console.log('Loaded tenants:', allTenants);
            } catch (error) {
                console.error('Tenant loading error:', error);
                tenantSelect.innerHTML = '<option value="">حدث خطأ في تحميل المستأجرين</option>';
                tenantSelect.disabled = true;
                retryButton.classList.add('show');
                setLoadStatus(`❌ حدث خطأ في تحميل المستأجرين:\n${error?.message || String(error)}`, 'error');
            }
        }

        function fillForm(tenant) {
            document.getElementById('tenant_code').value = String(tenant.tenant_code || '').toUpperCase();
            document.getElementById('created_at').value = tenant.created_at
                ? new Date(tenant.created_at).toLocaleString('en-GB')
                : '—';
            document.getElementById('tenant_name').value = tenant.tenant_name || '';
            document.getElementById('shop_no').value = tenant.shop_no || '';
            document.getElementById('phone').value = normalizePhoneForDisplay(tenant.phone);
            document.getElementById('annual_rent').value = tenant.annual_rent ?? '';
            document.getElementById('contract_date').value = tenant.contract_date || '';
            document.getElementById('password').value = '';
        }

        function handleTenantSelection() {
            clearFormStatus();

            const selectedCode = String(tenantSelect.value || '').trim();
            if (!selectedCode) {
                currentTenant = null;
                editPanel.classList.add('hidden');
                return;
            }

            currentTenant = allTenants.find((tenant) => String(tenant.tenant_code) === selectedCode) || null;

            if (!currentTenant) {
                editPanel.classList.add('hidden');
                setLoadStatus('تعذر العثور على بيانات المستأجر المختار. أعد تحميل القائمة.', 'error');
                return;
            }

            fillForm(currentTenant);
            editPanel.classList.remove('hidden');
            setLoadStatus(`تم اختيار ${String(currentTenant.tenant_code).toUpperCase()} — ${currentTenant.tenant_name || ''}`, 'success');
            editPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetForm() {
            if (!currentTenant) return;
            fillForm(currentTenant);
            clearFormStatus();
        }

        async function updateTenant(event) {
            event.preventDefault();

            if (isSaving) return;

            if (!currentTenant) {
                showFormStatus('الرجاء اختيار مستأجر أولاً', 'error');
                return;
            }

            const name = document.getElementById('tenant_name').value.trim();
            const shop = document.getElementById('shop_no').value.trim();
            const phone = normalizePhoneForDatabase(document.getElementById('phone').value);
            const annualRentRaw = document.getElementById('annual_rent').value.trim();
            const contractDate = document.getElementById('contract_date').value;
            const newPassword = document.getElementById('password').value.trim();
            const annualRent = Number(annualRentRaw);

            if (!name) {
                showFormStatus('الرجاء إدخال اسم المستأجر', 'error');
                return;
            }

            if (!Number.isFinite(annualRent) || annualRent <= 0) {
                showFormStatus('الرجاء إدخال قيمة عقد سنوي صحيحة', 'error');
                return;
            }

            if (newPassword && !/^\d{4}$/.test(newPassword)) {
                showFormStatus('كلمة المرور يجب أن تكون 4 أرقام', 'error');
                return;
            }

            const code = String(currentTenant.tenant_code || '').toUpperCase();
            const confirmed = window.confirm(`هل أنت متأكد من حفظ التعديلات على المستأجر ${code} — ${name}؟`);
            if (!confirmed) return;

            const updateData = {
                tenant_name: name,
                shop_no: shop || null,
                phone,
                annual_rent: annualRent,
                contract_date: contractDate || null
            };

            if (newPassword) {
                updateData.password = newPassword;
            }

            isSaving = true;
            saveButton.disabled = true;
            resetButton.disabled = true;
            saveButton.textContent = '⏳ جاري الحفظ...';
            clearFormStatus();

            try {
                const { data, error } = await db
                    .from('tenants')
                    .update(updateData)
                    .eq('tenant_code', currentTenant.tenant_code)
                    .select('id, tenant_code, tenant_name, shop_no, phone, created_at, contract_date, annual_rent, password')
                    .single();

                if (error) {
                    throw error;
                }

                const index = allTenants.findIndex((tenant) => tenant.tenant_code === data.tenant_code);
                if (index >= 0) {
                    allTenants[index] = data;
                }

                currentTenant = data;
                renderTenantOptions(allTenants);
                tenantSelect.value = data.tenant_code;
                fillForm(data);

                showFormStatus(`✅ تم تحديث بيانات المستأجر ${data.tenant_name} بنجاح`, 'success');
                setLoadStatus(`تم حفظ بيانات ${String(data.tenant_code).toUpperCase()} بنجاح.`, 'success');
            } catch (error) {
                console.error('Tenant update error:', error);
                showFormStatus(`❌ حدث خطأ أثناء الحفظ:\n${error?.message || String(error)}`, 'error');
            } finally {
                isSaving = false;
                saveButton.disabled = false;
                resetButton.disabled = false;
                saveButton.textContent = '💾 حفظ التعديلات';
            }
        }

        async function initializePage() {
            const session = localStorage.getItem('jabri_admin_session');
            if (session !== 'active') {
                window.location.href = 'admin-login.html';
                return;
            }

            await loadTenantsList();
        }

        tenantSelect.addEventListener('change', handleTenantSelection);
        tenantForm.addEventListener('submit', updateTenant);
        resetButton.addEventListener('click', resetForm);
        retryButton.addEventListener('click', loadTenantsList);

        window.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
