<script>
    // ============================================================
    // 🔥 SUPABASE CLIENT
    // ============================================================
    const supabaseUrl = 'https://gzukfvxcpfblzqyjzkoz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dWtmdnhjcGZibHpxeWp6a296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MjA3NjgsImV4cCI6MjA4OTM5Njc2OH0.7Jm1pg1MZEVj4B4IiGPU0yNmMPEPmClwUUkAv_rvGBU';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ============================================================
    // 🔐 SESSION CHECK
    // ============================================================
    if (localStorage.getItem('jabri_admin_session') !== 'active') {
        window.location.href = 'admin-login.html';
    }

    // ============================================================
    // 📋 GLOBAL VARIABLES
    // ============================================================
    let allTenants = [];
    let currentTenant = null;

    // ============================================================
    // 📋 LOAD TENANTS LIST (DEBUG VERSION)
    // ============================================================
    async function loadTenantsList() {
        const select = document.getElementById('tenant_select');
        console.log('🔍 loadTenantsList() started');
        console.log('🔍 Select element:', select);

        if (!select) {
            console.error('❌ Select element not found!');
            return;
        }

        select.disabled = true;
        select.innerHTML = '<option value="">⏳ جاري تحميل المستأجرين...</option>';

        try {
            console.log('🔍 Fetching tenants from Supabase...');
            const { data, error } = await supabase
                .from('tenants')
                .select('*')
                .order('tenant_code');

            console.log('🔍 Supabase response:', { data, error });

            if (error) {
                console.error('❌ Supabase error:', error);
                throw error;
            }

            allTenants = data || [];
            console.log('🔍 Tenants loaded:', allTenants.length, allTenants);

            // Sort by numeric code
            allTenants.sort((a, b) => {
                const numA = parseInt(String(a.tenant_code || '').replace(/\D/g, ''), 10) || 0;
                const numB = parseInt(String(b.tenant_code || '').replace(/\D/g, ''), 10) || 0;
                return numA - numB;
            });

            select.disabled = false;

            if (allTenants.length === 0) {
                console.warn('⚠️ No tenants found!');
                select.innerHTML = '<option value="">❌ لا يوجد مستأجرون مسجلون</option>';
                return;
            }

            // ✅ Build dropdown options with proper <option> tags
            let html = '<option value="">-- اختر مستأجر --</option>';
            allTenants.forEach(t => {
                const code = t.tenant_code || '';
                const name = t.tenant_name || '';
                html += `<option value="${code}">${code.toUpperCase()} — ${name}</option>`;
                console.log(`🔍 Added option: ${code} — ${name}`);
            });
            select.innerHTML = html;
            console.log('🔍 Dropdown HTML built successfully!');
            console.log('🔍 Final HTML:', html);

        } catch (err) {
            console.error('❌ Error loading tenants:', err);
            select.disabled = false;
            select.innerHTML = '<option value="">❌ حدث خطأ في تحميل المستأجرين</option>';
        }
    }

    // ============================================================
    // 📋 LOAD SELECTED TENANT
    // ============================================================
    function loadTenant() {
        const code = document.getElementById('tenant_select').value;
        console.log('🔍 loadTenant() called with code:', code);
        const panel = document.getElementById('edit_panel');
        clearStatus();

        if (!code) {
            panel.classList.add('hidden');
            currentTenant = null;
            return;
        }

        currentTenant = allTenants.find(t => t.tenant_code === code);
        if (!currentTenant) {
            console.warn('⚠️ Tenant not found in allTenants:', code);
            panel.classList.add('hidden');
            return;
        }

        console.log('🔍 Loading tenant:', currentTenant);
        fillForm(currentTenant);
        panel.classList.remove('hidden');
    }

    // ============================================================
    // 📝 FILL FORM
    // ============================================================
    function fillForm(t) {
        document.getElementById('tenant_code').value = (t.tenant_code || '').toUpperCase();
        document.getElementById('created_at').value = t.created_at
            ? new Date(t.created_at).toLocaleDateString('en-GB')
            : '—';
        document.getElementById('tenant_name').value = t.tenant_name || '';
        document.getElementById('shop_no').value = t.shop_no || '';
        document.getElementById('phone').value = t.phone || '';
        document.getElementById('annual_rent').value = t.annual_rent != null ? t.annual_rent : '';
        document.getElementById('contract_date').value = t.contract_date || '';
        document.getElementById('password').value = '';
    }

    // ============================================================
    // 🔄 RESET FORM
    // ============================================================
    function resetForm() {
        if (currentTenant) {
            fillForm(currentTenant);
            clearStatus();
        }
    }

    // ============================================================
    // 💾 UPDATE TENANT
    // ============================================================
    async function updateTenant() {
        if (!currentTenant) {
            showStatus('الرجاء اختيار مستأجر أولاً', 'error');
            return;
        }

        const name = document.getElementById('tenant_name').value.trim();
        const shop = document.getElementById('shop_no').value.trim();
        let phone = document.getElementById('phone').value.trim();
        const rent = document.getElementById('annual_rent').value.trim();
        const contract = document.getElementById('contract_date').value;
        const password = document.getElementById('password').value.trim();

        // Validation
        if (!name) {
            showStatus('الرجاء إدخال اسم المستأجر', 'error');
            return;
        }
        if (!rent || parseFloat(rent) <= 0) {
            showStatus('الرجاء إدخال إيجار سنوي صحيح', 'error');
            return;
        }
        if (password && (password.length !== 4 || !/^\d+$/.test(password))) {
            showStatus('كلمة المرور يجب أن تكون 4 أرقام', 'error');
            return;
        }

        // Format phone number
        if (phone) {
            phone = phone.replace(/\D/g, '');
            if (!phone.startsWith('962')) {
                if (phone.startsWith('0')) {
                    phone = phone.substring(1);
                }
                phone = '962' + phone;
            }
        }

        // Confirm before saving
        const confirmed = confirm(`هل أنت متأكد من حفظ التعديلات على المستأجر ${currentTenant.tenant_code.toUpperCase()} — ${name}؟`);
        if (!confirmed) return;

        const updateData = {
            tenant_name: name,
            shop_no: shop || null,
            phone: phone || null,
            annual_rent: parseFloat(rent),
            contract_date: contract || null
        };

        if (password) {
            updateData.password = password;
        }

        try {
            const { error } = await supabase
                .from('tenants')
                .update(updateData)
                .eq('tenant_code', currentTenant.tenant_code);

            if (error) throw error;

            showStatus(`✅ تم تحديث بيانات المستأجر ${name} بنجاح!`, 'success');

            // Update local copy
            Object.assign(currentTenant, updateData);

            // Refresh dropdown to reflect changes
            await loadTenantsList();
            document.getElementById('tenant_select').value = currentTenant.tenant_code;
            document.getElementById('password').value = '';

        } catch (err) {
            console.error('❌ Update error:', err);
            showStatus(`❌ حدث خطأ: ${err.message}`, 'error');
        }
    }

    // ============================================================
    // 📢 SHOW STATUS
    // ============================================================
    function showStatus(msg, type) {
        const el = document.getElementById('status_msg');
        el.textContent = msg;
        el.className = `status-msg ${type}`;
        el.style.display = 'block';
    }

    function clearStatus() {
        const el = document.getElementById('status_msg');
        el.className = 'status-msg';
        el.style.display = 'none';
    }

    // ============================================================
    // 🔙 GO BACK
    // ============================================================
    function goBack() {
        window.location.href = 'admin.html';
    }

    // ============================================================
    // 🚀 LOAD PAGE
    // ============================================================
    window.addEventListener('DOMContentLoaded', function() {
        console.log('🔍 DOM Content Loaded, calling loadTenantsList()...');
        loadTenantsList();
    });

    // Also try loading immediately if DOM is already loaded
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        console.log('🔍 DOM already loaded, calling loadTenantsList()...');
        loadTenantsList();
    }
</script>
