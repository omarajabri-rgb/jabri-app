<script>
    // ===== Supabase Client =====
    const supabase = window.supabase.createClient(
        'https://gzukfvxcpfblzqyjzkoz.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dWtmdnhjcGZibHpxeWp6a296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MjA3NjgsImV4cCI6MjA4OTM5Njc2OH0.7Jm1pg1MZEVj4B4IiGPU0yNmMPEPmClwUUkAv_rvGBU'
    );

    // ===== Session Check =====
    const session = localStorage.getItem('jabri_admin_session');
    if (session !== 'active') {
        window.location.href = 'admin-login.html';
    }

    // ===== Load Tenants =====
    async function loadTenantsDirect() {
        console.log('🔍 Loading tenants...');
        try {
            const { data, error } = await supabase
                .from('tenants')
                .select('tenant_code, tenant_name')
                .order('tenant_name');

            if (error) {
                console.error('❌ Error:', error);
                alert('خطأ في تحميل المستأجرين: ' + error.message);
                return;
            }

            console.log('✅ Found', data?.length || 0, 'tenants');
            
            const select = document.getElementById('tenant_code');
            if (!select) {
                console.error('❌ Dropdown not found!');
                return;
            }

            select.innerHTML = '<option value="">-- اختر مستأجر --</option>';
            
            if (data && data.length > 0) {
                data.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.tenant_code;
                    opt.textContent = t.tenant_name + ' (' + t.tenant_code + ')';
                    select.appendChild(opt);
                });
                console.log('✅ Dropdown populated with', data.length, 'tenants');
            } else {
                console.log('⚠️ No tenants found');
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '❗ لا يوجد مستأجرين';
                select.appendChild(opt);
            }
        } catch (err) {
            console.error('❌ Error:', err);
            alert('خطأ: ' + err.message);
        }
    }

    // ===== Load Cases =====
    async function loadCases() {
        try {
            console.log('📋 Loading cases...');
            const { data, error } = await supabase
                .from('court_cases')
                .select('*, tenants(tenant_name)')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('❌ خطأ في تحميل القضايا:', error);
                const tbody = document.getElementById('casesTableBody');
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">لا توجد قضايا مسجلة</td></tr>`;
                return;
            }

            console.log('✅ Cases loaded:', data?.length || 0);

            const tbody = document.getElementById('casesTableBody');

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">لا توجد قضايا مسجلة</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(c => `
                <tr>
                    <td>${c.tenants?.tenant_name || c.tenant_code}</td>
                    <td><strong>${c.case_number}</strong></td>
                    <td>${c.case_date ? new Date(c.case_date).toLocaleDateString('en-GB') : '—'}</td>
                    <td>${c.amount ? Number(c.amount).toLocaleString('en-US') : '—'}</td>
                    <td>${c.notes || '—'}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteCase('${c.id}')">🗑️</button>
                    </td>
                </tr>
            `).join('');
        } catch (err) {
            console.error('❌ Error in loadCases:', err);
        }
    }

    // ===== Save Case =====
    async function saveCase() {
        const tenantCode = document.getElementById('tenant_code').value;
        const caseNumber = document.getElementById('case_number').value.trim();
        const caseDate = document.getElementById('case_date').value;
        const amount = document.getElementById('amount').value.trim();
        const notes = document.getElementById('notes').value.trim();

        if (!tenantCode) {
            showStatus('الرجاء اختيار المستأجر', 'error');
            return;
        }
        if (!caseNumber) {
            showStatus('الرجاء إدخال رقم القضية', 'error');
            return;
        }

        try {
            const { data, error } = await supabase
                .from('court_cases')
                .insert([{
                    tenant_code: tenantCode,
                    case_number: caseNumber,
                    case_date: caseDate || null,
                    amount: amount ? parseFloat(amount) : null,
                    notes: notes || null
                }])
                .select()
                .single();

            if (error) throw error;

            showStatus(`✅ تم إضافة القضية ${caseNumber} بنجاح!`, 'success');
            clearCaseForm();
            loadCases();

        } catch (err) {
            console.error(err);
            showStatus(`❌ حدث خطأ: ${err.message}`, 'error');
        }
    }

    // ===== Delete Case =====
    async function deleteCase(id) {
        if (!confirm('هل أنت متأكد من حذف هذه القضية؟')) return;

        try {
            const { error } = await supabase
                .from('court_cases')
                .delete()
                .eq('id', id);

            if (error) throw error;

            loadCases();
        } catch (err) {
            console.error(err);
            alert('❌ حدث خطأ أثناء الحذف');
        }
    }

    // ===== Clear Form =====
    function clearCaseForm() {
        document.getElementById('tenant_code').value = '';
        document.getElementById('case_number').value = '';
        document.getElementById('case_date').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('notes').value = '';
        document.getElementById('status_msg').className = 'status-msg';
        document.getElementById('status_msg').style.display = 'none';
    }

    // ===== Show Status =====
    function showStatus(msg, type) {
        const el = document.getElementById('status_msg');
        el.textContent = msg;
        el.className = `status-msg ${type}`;
        el.style.display = 'block';
    }

    // ===== Go Back =====
    function goBack() {
        window.location.href = 'admin.html';
    }

    // ===== Scroll to Form =====
    function scrollToCaseForm() {
        document.getElementById('case_form_panel').scrollIntoView({ behavior: 'smooth' });
    }

    // ===== LOAD PAGE =====
    // This runs when the page loads
    window.onload = function() {
        console.log('🚀 Page loaded - starting...');
        loadTenantsDirect();
        loadCases();
        console.log('✅ Page load complete');
    };
</script>
