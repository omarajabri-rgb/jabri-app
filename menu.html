<!DOCTYPE html>
<!--
  ============================================================
  BURGER MENU — مجمع جبري الصناعي التجاري
  ============================================================
  طريقة الدمج داخل admin.html:
    1) انسخ محتوى <style> أدناه (بين START/END CSS) والصقه داخل
       وسم <style> الموجود في admin.html (بعد المتغيرات :root).
    2) انسخ كتلة الـ HTML (بين START/END HTML) والصقها مباشرة
       بعد وسم <body> (أو بعد .topbar) — أي في أعلى الصفحة.
    3) انسخ كتلة الـ JS (بين START/END JS) والصقها داخل وسم
       <script> الرئيسي في admin.html (مثلاً قبل window.onload).
       ملاحظة: logoutAdmin() معرّفة أصلاً في admin.html، لذلك
       تم وضع حارس (guard) هنا كي لا يتم استبدالها.
  هذا الملف صالح للعرض المباشر لتجربة القائمة فقط.
  ============================================================
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Burger Menu — مجمع جبري</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===================== START CSS ===================== */
:root{
    --bg:#f7f4ec;
    --card:rgba(255,255,255,0.72);
    --text:#1f2937;
    --muted:#7a7469;
    --gold:#c9a46b;
    --gold-deep:#b78e54;
    --line:rgba(91,73,42,0.10);
    --danger:#d14d4d;
    --shadow:0 18px 45px rgba(87,68,37,0.10);
}
*{ box-sizing:border-box; font-family:'Tajawal',sans-serif; -webkit-tap-highlight-color:transparent; }
body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(circle at top right, rgba(201,164,107,0.11), transparent 22%),
        linear-gradient(135deg, #f8f4eb 0%, #f2ede3 100%);
}

/* زر القائمة (البرغر) — أعلى الزاوية اليمنى */
.burger-btn{
    position:fixed;
    top:18px;
    right:18px;
    width:46px;
    height:46px;
    border-radius:15px;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--gold), var(--gold-deep));
    box-shadow:0 12px 24px rgba(201,164,107,0.28);
    z-index:9999;
    transition:transform .2s ease;
}
.burger-btn:hover{ transform:translateY(-1px); }
.burger-btn span{
    font-size:20px;
    color:#fff;
    line-height:1;
    transition:transform .25s ease;
}
.burger-btn.active span{ transform:rotate(90deg); }

/* الطبقة المعتمة خلف القائمة */
.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(31,41,55,0.35);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:9998;
}
.menu-overlay.open{ opacity:1; pointer-events:auto; }

/* القائمة الجانبية المنزلقة من اليمين */
.side-menu{
    position:fixed;
    top:0;
    right:0;
    height:100vh;
    width:300px;
    max-width:86vw;
    background:rgba(255,255,255,0.86);
    backdrop-filter:blur(18px);
    border-left:1px solid rgba(255,255,255,0.6);
    box-shadow:-18px 0 45px rgba(87,68,37,0.18);
    border-top-left-radius:28px;
    border-bottom-left-radius:28px;
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    z-index:9999;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}
.side-menu.open{ transform:translateX(0); }

.side-menu-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px;
    border-bottom:1px solid var(--line);
    font-weight:900;
    font-size:15px;
    color:#544128;
}
.side-menu-close{
    width:34px;
    height:34px;
    border-radius:10px;
    border:1px solid rgba(201,164,107,0.22);
    background:rgba(201,164,107,0.12);
    color:var(--gold-deep);
    font-weight:900;
    cursor:pointer;
}

.side-menu-body{ padding:10px 0 20px; }

.menu-category{ border-bottom:1px solid rgba(91,73,42,0.06); }
.menu-category-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:transparent;
    border:none;
    padding:15px 18px;
    font-size:14px;
    font-weight:800;
    color:var(--text);
    cursor:pointer;
    text-align:right;
}
.menu-category-header:hover{ background:rgba(201,164,107,0.08); }
.menu-category-header .chevron{
    font-size:14px;
    color:var(--muted);
    transition:transform .25s ease;
}
.menu-category.open .menu-category-header .chevron{ transform:rotate(-90deg); }
.menu-category.open .menu-category-header{ color:#6b4f2b; }

.submenu{
    max-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:max-height .3s ease;
}
.menu-category.open .submenu{ max-height:260px; }

.menu-item{
    width:calc(100% - 28px);
    margin:5px 14px;
    padding:11px 16px;
    border-radius:14px;
    border:1px solid rgba(201,164,107,0.14);
    background:rgba(255,255,255,0.6);
    color:#6b4f2b;
    font-size:13px;
    font-weight:800;
    text-align:right;
    cursor:pointer;
    transition:.2s ease;
}
.menu-item:hover{
    background:rgba(201,164,107,0.14);
    border-color:rgba(201,164,107,0.28);
}

.menu-leaf-btn{
    width:calc(100% - 28px);
    margin:16px 14px 20px;
    padding:14px;
    border-radius:16px;
    border:1px solid rgba(209,77,77,0.18);
    background:rgba(209,77,77,0.12);
    color:var(--danger);
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    text-align:center;
}
.menu-leaf-btn:hover{ background:rgba(209,77,77,0.18); }

@media (max-width:480px){
    .side-menu{ width:88vw; }
}
/* ===================== END CSS ===================== */
</style>
</head>
<body>

<!-- ===================== START HTML ===================== -->

<!-- زر القائمة -->
<button class="burger-btn" id="burgerBtn" onclick="toggleMenu()" aria-label="القائمة الرئيسية">
    <span id="burgerIcon">☰</span>
</button>

<!-- الطبقة المعتمة -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<!-- القائمة الجانبية -->
<aside class="side-menu" id="sideMenu">
    <div class="side-menu-header">
        <span>☰ القائمة الرئيسية</span>
        <button class="side-menu-close" onclick="closeMenu()">✕</button>
    </div>

    <nav class="side-menu-body">

        <div class="menu-category">
            <button class="menu-category-header" onclick="toggleCategory(this)">
                <span>🏢 إدارة المستأجرين</span>
                <span class="chevron">›</span>
            </button>
            <div class="submenu">
                <button class="menu-item" onclick="menuAction('إضافة مستأجر جديد')">➕ إضافة مستأجر جديد</button>
            </div>
        </div>

        <div class="menu-category">
            <button class="menu-category-header" onclick="toggleCategory(this)">
                <span>⚖️ القضايا</span>
                <span class="chevron">›</span>
            </button>
            <div class="submenu">
                <button class="menu-item" onclick="menuAction('قائمة القضايا')">📋 قائمة القضايا</button>
                <button class="menu-item" onclick="menuAction('إضافة قضية جديدة')">➕ إضافة قضية جديدة</button>
            </div>
        </div>

        <div class="menu-category">
            <button class="menu-category-header" onclick="toggleCategory(this)">
                <span>💸 مصروفات المجمع</span>
                <span class="chevron">›</span>
            </button>
            <div class="submenu">
                <button class="menu-item" onclick="menuAction('إضافة مصروف')">➕ إضافة مصروف</button>
                <button class="menu-item" onclick="menuAction('قائمة المصروفات')">📋 قائمة المصروفات</button>
            </div>
        </div>

        <div class="menu-category">
            <button class="menu-category-header" onclick="toggleCategory(this)">
                <span>⚙️ الإعدادات</span>
                <span class="chevron">›</span>
            </button>
            <div class="submenu">
                <button class="menu-item" onclick="menuAction('تغيير كلمة المرور')">🔑 تغيير كلمة المرور</button>
                <button class="menu-item" onclick="menuAction('إعدادات واتساب')">🌐 إعدادات واتساب</button>
            </div>
        </div>

        <button class="menu-leaf-btn" onclick="logoutAdmin()">🚪 خروج</button>

    </nav>
</aside>

<!-- ===================== END HTML ===================== -->

<script>
/* ===================== START JS ===================== */
function toggleMenu(){
    const menu = document.getElementById('sideMenu');
    const overlay = document.getElementById('menuOverlay');
    const btn = document.getElementById('burgerBtn');
    const isOpen = menu.classList.toggle('open');
    overlay.classList.toggle('open', isOpen);
    btn.classList.toggle('active', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
}

function closeMenu(){
    document.getElementById('sideMenu').classList.remove('open');
    document.getElementById('menuOverlay').classList.remove('open');
    document.getElementById('burgerBtn').classList.remove('active');
    document.body.style.overflow = '';
}

function toggleCategory(headerBtn){
    const category = headerBtn.parentElement;
    const wasOpen = category.classList.contains('open');
    document.querySelectorAll('.menu-category.open').forEach(c => c.classList.remove('open'));
    if(!wasOpen) category.classList.add('open');
}

function menuAction(name){
    alert(name);
    closeMenu();
}

document.addEventListener('keydown', e => {
    if(e.key === 'Escape') closeMenu();
});

/* logoutAdmin موجودة أصلاً في admin.html — هذا حارس فقط كي يعمل
   الملف بشكل مستقل عند تجربته بمعزل عن admin.html */
window.logoutAdmin = window.logoutAdmin || function(){
    localStorage.removeItem('jabri_admin_session');
    location.reload();
};
/* ===================== END JS ===================== */
</script>

</body>
</html>
